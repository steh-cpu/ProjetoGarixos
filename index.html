<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garixos - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="auth-page">
    <div class="page-container">
        <section class="auth-card">
            <div class="brand">
                <img src="assets/logosemfundo.png" alt="Garinxo" class="brand-logo">
            </div>

            <div class="message-box" id="loginMessage"></div>

            <form id="loginForm">
                <div>
                    <label for="emailLogin">Email</label>
                    <input id="emailLogin" type="email" placeholder="seu@email.com" autocomplete="username" required>
                </div>

                <div>
                    <label for="passwordLogin">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordLogin" placeholder="Digite sua senha" required>
                        <span class="toggle-password" onclick="togglePassword('passwordLogin', this)">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>
                
                <p class="forgot-password" onclick="openForgotPasswordModal()">Esqueceu a senha?</p>

                <button type="submit" class="primary-btn">Entrar</button>
            </form>
            <p>OU</p>

            <div class="social-buttons">
                <button id="gmailBtn" type="button" class="social-btn gmail">Entrar com Gmail</button>
                <button id="facebookBtn" type="button" class="social-btn facebook">Entrar com Facebook</button>
            </div>

            <p class="small-text">Ainda não tem cadastro? <a href="criarcadastro.html">Crie uma conta</a></p>
        </section>

        <section class="hero-panel">
            <h2>Seu portal municipal moderno</h2>
            <p>Use seu email para acessar o painel e acompanhar serviços. Suas informações estão seguras conosco.</p>
        </section>
    </div>

    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeForgotPasswordModal()">&times;</button>
            <h2>Recuperar senha</h2>
            <p>Digite o email cadastrado.</p>
            <input type="email" id="recoverEmail" placeholder="Seu email">
            <button class="primary-btn" onclick="recoverPassword()">Enviar senha</button>
        </div>
    </div>

    <script>
        const sessionKey = 'garinxoCurrentUser';

        function showMessage(text, type = 'error') {
            const box = document.getElementById('loginMessage');
            box.textContent = text;
            box.className = `message-box ${type}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        function togglePassword(inputId, iconContainer) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = iconContainer.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ==========================================
        // LÓGICA DE LOGIN COM A API (BACK-END)
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            
            const email = document.getElementById('emailLogin').value.trim();
            const password = document.getElementById('passwordLogin').value.trim();

            if (!email || !password) {
                showMessage('Por favor, preencha o email e a senha.', 'error');
                return;
            }

            try {
                // Envia as credenciais para a rota de login da API
                const resposta = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: password })
                });

                if (resposta.ok) {
                    const dados = await resposta.json();
                    
                    // Salva os dados do usuário (id, nome, email) no localStorage
                    localStorage.setItem(sessionKey, JSON.stringify(dados.usuario));
                    
                    showMessage('Login aprovado! Entrando...', 'success');
                    setTimeout(() => {
                        window.location.href = 'principal.html';
                    }, 1500);
                } else {
                    const erro = await resposta.json();
                    showMessage(erro.mensagem || 'Email ou senha incorretos.', 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('Erro ao conectar com o servidor. O back-end está ligado?', 'error');
            }
        });

        document.getElementById('gmailBtn').addEventListener('click', () => {
            showMessage('Login com Gmail em desenvolvimento.', 'success');
        });

        document.getElementById('facebookBtn').addEventListener('click', () => {
            showMessage('Login com Facebook em desenvolvimento.', 'success');
        });

        // Recuperação de senha visual
        emailjs.init("ZU8Cn-oC4L0bnD_M8");
        function openForgotPasswordModal() { document.getElementById("forgotPasswordModal").classList.add("open"); }
        function closeForgotPasswordModal() { document.getElementById("forgotPasswordModal").classList.remove("open"); }
        function recoverPassword() {
            const email = document.getElementById("recoverEmail").value.trim();
            if (!email) { alert("Digite seu email."); return; }
            alert("A funcionalidade de email será integrada com o banco de dados em breve.");
            closeForgotPasswordModal();
        }
    </script>
</body>
</html>
