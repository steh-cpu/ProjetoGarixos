<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garixos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="auth-page">
    <div class="page-container">
        <section class="auth-card">
            <div class="brand">
                <img src="assets/logosemfundo.png" alt="Garinxo" class="brand-logo">
            </div>

            <div class="message-box" id="loginMessage"></div>

            <form id="loginForm">
                <div>
                    <label for="cpfLogin">CPF</label>
                    <input id="cpfLogin" type="text" placeholder="000.000.000-00" maxlength="14" autocomplete="username" required>
                </div>

                <div>
                    <label for="passwordLogin">Senha</label>
                    <div class="password-wrapper">
  <input type="password" id="passwordLogin" placeholder="Digite sua senha">

  <span class="toggle-password"
      onclick="togglePassword('passwordLogin', this)">
      <i class="fa-solid fa-eye"></i>
</span>
</div>
                </div>
                <p class="forgot-password"
   onclick="openForgotPasswordModal()">
   Esqueceu a senha?
</p>

                <button type="submit" class="primary-btn">Entrar</button>
            </form>
            <p>OU</p>

            <div class="social-buttons">
                <button id="gmailBtn" type="button" class="social-btn gmail">Entrar com Gmail</button>
                <button id="facebookBtn" type="button" class="social-btn facebook">Entrar com Facebook</button>
            </div>

            <p class="small-text">Ainda não tem cadastro? <a href="criarcadastro.html">Crie uma conta</a></p>
        </section>

        <section class="hero-panel">
            <h2>Seu portal municipal moderno</h2>
            <p>Use seu CPF para acessar o painel e acompanhar serviços. Suas informações estão seguras conosco.</p>
        </section>
    </div>
    <div id="forgotPasswordModal" class="modal">
  <div class="modal-content">

    <button class="close-btn"
            onclick="closeForgotPasswordModal()">
      &times;
    </button>

    <h2>Recuperar senha</h2>

    <p>Digite o email cadastrado.</p>

    <input type="email"
           id="recoverEmail"
           placeholder="Seu email">

    <button class="primary-btn"
            onclick="recoverPassword()">
      Enviar senha
    </button>

  </div>
</div>

    <script>
        // Chave do localStorage onde os usuários são armazenados
        const storageKey = 'garinxoUsers';
        const sessionKey = 'garinxoCurrentUser';

        // Função para ler os usuários do localStorage
        function getUsers() {
            const saved = localStorage.getItem(storageKey);
            return saved ? JSON.parse(saved) : [];
        }

        // Função para gravar usuários no localStorage
        function saveUsers(users) {
            localStorage.setItem(storageKey, JSON.stringify(users));
        }

        // Normaliza o CPF removendo caracteres não numéricos
        function normalizeCPF(value) {
            return value.replace(/\D/g, '');
        }

        // Exibe mensagens de sucesso ou erro na interface
        function showMessage(text, type = 'error') {
            const box = document.getElementById('loginMessage');
            box.textContent = text;
            box.className = `message-box ${type}`;
            box.style.display = 'block';
            setTimeout(() => {
                box.style.display = 'none';
            }, 5000);
        }

        // Máscara visual para CPF durante a digitação
        function maskCPF(value) {
            const digits = normalizeCPF(value);
            const part1 = digits.slice(0, 3);
            const part2 = digits.slice(3, 6);
            const part3 = digits.slice(6, 9);
            const part4 = digits.slice(9, 11);
            let masked = part1;
            if (part2) masked += '.' + part2;
            if (part3) masked += '.' + part3;
            if (part4) masked += '-' + part4;
            return masked;
        }

        document.getElementById('cpfLogin').addEventListener('input', event => {
            event.target.value = maskCPF(event.target.value);
        });

        document.getElementById('loginForm').addEventListener('submit', event => {
            event.preventDefault();
            const cpf = normalizeCPF(document.getElementById('cpfLogin').value);
            const password = document.getElementById('passwordLogin').value.trim();

            if (cpf.length !== 11) {
                showMessage('Informe um CPF válido com 11 dígitos.', 'error');
                return;
            }

            if (!password) {
                showMessage('Informe sua senha.', 'error');
                return;
            }

            const users = getUsers();
            const user = users.find(entry => entry.cpf === cpf);

            if (!user) {
                showMessage('CPF não encontrado. Crie uma conta primeiro.', 'error');
                return;
            }

            if (user.password !== password) {
                showMessage('Senha incorreta. Verifique e tente novamente.', 'error');
                return;
            }

            // Salva o usuário atual e redireciona para a página principal
            localStorage.setItem(sessionKey, cpf);
            window.location.href = 'principal.html';
        });

        document.getElementById('gmailBtn').addEventListener('click', () => {
            showMessage('Login com Gmail não está disponível neste protótipo.', 'success');
        });

        document.getElementById('facebookBtn').addEventListener('click', () => {
            showMessage('Login com Facebook não está disponível neste protótipo.', 'success');
        });
        function togglePassword(inputId, iconContainer) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const icon = iconContainer.querySelector('i');

  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}
emailjs.init("ZU8Cn-oC4L0bnD_M8");

function openForgotPasswordModal() {
  document.getElementById("forgotPasswordModal").classList.add("open");
}

function closeForgotPasswordModal() {
  document.getElementById("forgotPasswordModal").classList.remove("open");
}

function recoverPassword() {
  const email = document.getElementById("recoverEmail").value.trim();

  if (!email) {
    alert("Digite seu email.");
    return;
  }

  const users = JSON.parse(localStorage.getItem("garinxoUsers")) || [];
  const user = users.find(u => u.email === email);

  if (!user) {
    alert("Email não encontrado.");
    return;
  }

  emailjs.send(
    "service_qjal7z5",
    "template_380ivd7",
    {
      name: user.fullName,
      password: user.password,
      email: email
    }
  )
  .then(() => {
    alert("Senha enviada para seu email.");
    closeForgotPasswordModal();
  })
  .catch(() => {
    alert("Erro ao enviar email.");
  });
}
    </script>
</body>
</html>
